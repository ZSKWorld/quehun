syntax = "proto3";

import "com.struct.proto";

package lq;

option go_package = ".;majprotocol";

message AmuletBadgeData {
  uint32 id = 1; // 表内的印章id
  uint32 uid = 2; // 实例id
  repeated string store = 3;
  uint32 random = 4; // 随机值，用于印章随机角度展示等，范围 1-100000
}

message AmuletEffectData {
  uint32 id = 1; // 表内的护身符id
  uint32 uid = 2; // 实例id
  repeated string store = 3;

  AmuletBadgeData badge = 4; // 印章数据，可能为空
  uint32 volume = 5; // （客户端数据）护身符占用体积

  repeated uint32 tags = 6; // 护身符标记位，tags[0] = 当前护身符是否回合结束消失

}

message AmuletRuneStoneData {
  uint32 id = 1;
  repeated string store = 2;
}

message AmuletTile {
  uint32 id = 1;
  string tile = 2;
}

message AmuletBuffData {
  uint32 id = 1; // 表内的buff id
  repeated string store = 3;
}

message AmuletGameShopGoods {
  uint32 id = 1;
  bool sold = 2;
  uint32 goods_id = 3;
  uint32 price = 4;
}

message AmuletShopUpgradeGoods {
  uint32 id = 1; // 唯一id, 升级传参用
  uint32 upgrade_id = 2; // 升级项 id, 对应 amulet.amulet_shop_upgrade 表的 id
  uint32 level = 3; // 升级项等级，对应 amulet.amulet_shop_upgrade 表的 level
  uint32 price = 4; // 价格
}

message AmuletActivityTingInfo {
  string tile = 1; // 打这张牌能听，在换牌阶段没有这个字段
  string fan = 2;
  string ting_tile = 3; // 听的牌
}

message AmuletShowDesktopTileData {
  uint32 id = 1;
  uint32 pos = 2; // 位置，从后往前数第几个，最小为0，发牌后不会随着摸牌而变化
}

message AmuletMingInfo {
  uint32 type = 1;
  repeated uint32 tile_list = 2;
}

message AmuletGameOperation {
  message GangTiles {
    repeated uint32 tiles = 1;
  }

  uint32 type = 1; // 1-切牌 4-杠 8-和 99-模切，只能打刚刚摸到的牌 100-开始游戏(仅限换牌阶段) 101-换手牌
  repeated GangTiles gang = 2; // type = 4 时可以杠的列表
  int32 value = 3; // 换手牌时表示最多可以换多少张牌
}

message AmuletTileScore {
  string tile = 1;
  string score = 2;
}

message ActivityAmuletHuRecord {
  string point = 1; // 得分
  string pai = 2; // 牌型  例：1m2m3m4m4m,5p5p5p0p,7s7s7s7s
  string fan = 3; // 番数
  string base = 4; // 分
  repeated ActivityAmuletEffectRecordData effect_builds = 5;
}

message AmuletEffectCounterData {
  uint32 effect_id = 1;
  uint32 pack_candidate_count = 2;
  uint32 gain_count = 3;
}

message AmuletGameRecordData {
  uint32 yiman_count = 1;
  uint32 level_hu_count = 2;
  uint32 game_hu_count = 3;
  uint32 effect_gain = 4;
  string coin_consume = 5;
  string coin_gain = 6;
  ActivityAmuletHuRecord highest_hu = 7;
  string highest_level_score = 8;
  string highest_fan = 9;
  uint32 pack_count = 10;
  uint32 round_count = 11;
  repeated AmuletEffectCounterData effect_counter = 12; // 统计护身符出现次数，仅统计出现过的护身符
  repeated uint32 hu_tiles_id = 13; // 上局和牌手牌（记录牌id）
  uint32 effect_upgrade_count = 14; // 护身符升级次数
}

message AmuletSkillData {
  uint32 id = 1;
  uint32 level = 2;
}

message ActivityAmuletUpgradeData {
  repeated AmuletSkillData skill = 2; // 已分配技能点数与等级
}

message AmuletEnemyData {
  uint32 id = 1;
  string max_hp = 2;
  string hp = 3;
  uint32 atk = 4;
}

message AmuletGameRoundData {
  // 客户端与服务端共用
  repeated AmuletTile pool = 1;
  repeated AmuletTile tile_replace = 2;
  repeated string tian_dora = 3;
  repeated uint32 dora = 4;
  repeated uint32 hands = 5;
  repeated uint32 used_desktop = 6;
  repeated AmuletMingInfo ming = 7;
  repeated uint32 locked_tile = 8;
  uint32 change_tile_count = 9;
  uint32 total_change_tile_count = 10;
  repeated AmuletGameOperation next_operation = 11;
  repeated AmuletActivityTingInfo ting_list = 12;
  // string point = 13;
  // string target_point = 14;
  uint32 locked_tile_count = 15;
  AmuletEnemyData enemy = 17; // 敌人
  uint32 delay_round = 107; // 苦战回合数

  // 服务端专用
  repeated uint32 mountain = 101;
  repeated uint32 used = 102;
  repeated uint32 desktop = 103;
  repeated uint32 show_desktop = 104;
  uint32 after_gang = 105;
  repeated uint32 berserk_tile = 106; // 狂暴牌

  // 客户端专用
  uint32 desktop_remain = 201;
  repeated AmuletShowDesktopTileData show_desktop_tiles = 202;
  repeated uint32 berserk_tile_pos = 203; // 狂暴牌位置
}

message AmuletEffectCandidate {
  uint32 id = 1; // 护身符ID
  uint32 badge_id = 2; // 印章ID，0表示没有印章
}

message AmuletPackQueue {
  uint32 pack_id = 1;
  repeated uint32 sure_candidate = 2; // 一定能开出的卡
  uint32 count = 3; // 从卡包里开出几张卡
  uint32 disable_skip = 4; // 是否允许跳过，不选卡
  uint32 source = 5; // 卡包来源 1-商店卡包 2-关卡奖励 3-转盘选卡 4-初始三选一
}

message AmuletGameEffectData {
  repeated AmuletEffectData effect_list = 1;
  repeated AmuletBuffData buff_list = 2;
  repeated AmuletBuffData skill_buff_list = 3;
  repeated AmuletBuffData shop_buff_list = 4;
  repeated AmuletRuneStoneData rune_stone_list = 5;

  // repeated AmuletEffectCandidate free_reward_candidates = 5;
  // repeated AmuletEffectCandidate level_reward_candidates = 6; // 关卡奖励卡包护身符选项
  // repeated uint32 level_reward_packs = 7; // 未开的关卡奖励卡包
  // uint32 current_level_reward_pack = 8; // 当前关卡奖励卡包id

  uint32 max_effect_volume = 9; // 客户端数据，最大护身符持有体积
  repeated AmuletEffectCandidate pack_candidates = 10; // 卡包中断状态，待选卡
  uint32 pack_goods_id = 11; // 卡包中断状态，打开的卡包id
  repeated AmuletPackQueue pack_queue = 12; // 待开启的卡包
  uint32 pack_disable_skip = 13; // 当前卡包中断状态是否禁止跳过
}

message AmuletMapNodeData {
  /**
    地图节点类型:
    1 - 起始点
    2 - 小战斗
    3 - 事件点
    4 - 大战斗
  */
  uint32 type = 1;
  /**
    节点子类型
    小战斗： 怪物id
    事件点： 事件类型
    大战斗： 怪物id
  */
  uint32 sub_type = 2;
  /**
    节点参数
    大战斗：[怪物技能id]
  */
  repeated uint32 args = 3;
}

message AmuletMapData {
  uint32 level = 1;
  uint32 node = 2;
  repeated AmuletMapNodeData map_nodes = 3;
  uint32 transport_count = 4; // 传送次数
}

message AmuletCharacterData {
  uint32 character_id = 1;
  uint32 max_hp = 2;
  uint32 hp = 3;
}

message AmuletShopData {
  repeated AmuletGameShopGoods goods = 1;
  // repeated AmuletEffectCandidate candidate_effect_list = 2;
  uint32 shop_refresh_count = 3;

  // 客户端专用
  uint32 refresh_price = 4;

  repeated AmuletShopUpgradeGoods upgrade_goods = 5; // 商店升级商品
}

message AmuletStateData {
  uint32 current = 1; // 游戏状态  https://confluence.catfoodstudio.net:5443/pages/viewpage.action?pageId=159359044#id-%E9%9D%92%E4%BA%91%E4%B9%8B%E5%BF%974.0%E5%BC%80%E5%8F%91%E6%96%87%E6%A1%A3-%E6%B8%B8%E6%88%8F%E7%8A%B6%E6%80%81.1
  uint32 interrupt = 2; // 中断状态 https://confluence.catfoodstudio.net:5443/pages/viewpage.action?pageId=159359044#id-%E9%9D%92%E4%BA%91%E4%B9%8B%E5%BF%974.0%E5%BC%80%E5%8F%91%E6%96%87%E6%A1%A3-%E4%B8%AD%E6%96%AD%E7%8A%B6%E6%80%81.1
}

message AmuletAdvancedShopGoods {
  uint32 id = 1;
  uint32 type = 2; // 1-护身符 2-符文石
  AmuletEffectCandidate effect = 3; // 护身符数据,type=1时有值
  uint32 rune_stone = 4; // 符文石id,type=2时有值
  uint32 sold = 5; // 是否已售
  uint32 price = 6; // 价格
}

message AmuletNodeEventData {
  repeated AmuletAdvancedShopGoods advanced_shop_goods = 1;
  uint32 advanced_shop_refresh_count = 2;

  repeated uint32 bonfire_selection = 3;

  uint32 gamble_id = 4; // 转盘id
  uint32 gamble_count = 5; // 转盘次数
  uint32 gamble_price = 6; // 转盘价格，客户端专用
  repeated uint32 gamble_selections = 7; // 转盘选项

  repeated AmuletTradeItem trade_items = 8; // 交易条件
  uint32 trade_count = 9; // 交易次数
  AmuletTradeReward trade_reward = 10; // 交易奖励

  repeated AmuletAdvancedShopUpgrade advanced_shop_upgrade = 11; // 高级商店升级
  uint32 advanced_shop_refresh_price = 12; // 高级商店刷新价格
}

message AmuletAdvancedShopUpgrade {
  uint32 id = 1; // 唯一id, 购买传参用
  uint32 upgrade_id  = 2; // amulet_advanced_shop_upgrade 表id
  uint32 sold = 3; // 是否已售, 1=已售 0-未售
  uint32 price = 4; // 价格
}

message AmuletTradeItem {
  uint32 id = 1; // 交易条件配表id, amulet.amulet_trade_item
  repeated uint32 store = 2; // 存放随机值
}

message AmuletTradeReward {
  uint32 id = 1; // 交易奖励的配表id, amulet.amulet_trade_reward
  uint32 type = 2; // 种类 1=护身符，2=符文石
  uint32 rune_stone_id = 3; // 符文石id, type=2时有值
  uint32 effect_id = 4; // 护身符id, type=1时有值
  uint32 badge_id = 5; // 印章id, type=1时可能有值
}

// ==DevDebug Start==
// debug 协议在正式版本删除
message AmuletDebugDesktop {
  repeated uint32 desktop = 1; // 待摸牌
  repeated uint32 mountain = 2; // 山
  repeated uint32 show_desktop = 3; // 公开牌
  int32 locked_tile_count = 4; // 锁定牌数量, -1 表示不控制
}

message AmuletDebugData {
  OptionalUInt32 gamble_destroy_rate = 1; // 转盘爆炸概率
  repeated AmuletMapNodeData map_nodes = 2; // 固定关卡小关构成
  repeated AmuletEffectCandidate pack_candidates = 3; // 固定卡包结果
  OptionalUInt32 gamble_result = 4; // 固定转盘结果
  repeated AmuletDebugDesktop next_desktop = 5; // 控制下次发牌（初始和苦战都生效）
}

message OptionalUInt32 {
  uint32 enabled = 1; // 是否启用
  uint32 value = 2;
}
// ==DevDebug End==

message AmuletGameData {
  AmuletGameRoundData round = 1;
  AmuletGameEffectData effect = 2;
  AmuletGameInfoData game = 3;
  // uint32 stage = 4;
  AmuletShopData shop = 5;
  AmuletGameRecordData record = 6;
  AmuletStateData state = 7;
  AmuletMapData map = 8;
  AmuletCharacterData character = 9;
  AmuletNodeEventData node_event = 10;
  // ==DevDebug Start==
  AmuletDebugData debug = 11;
  // ==DevDebug End==
  // bool ended = 7; // 本局游戏是否已经结束
}

message AmuletFanValue {
  uint32 id = 1;
  string value = 2;
}

message AmuletGameInfoData {
  uint32 level = 1;
  string coin = 2;
  uint32 max_effect_volume = 3;
  // repeated uint32 next_boss_buff = 4;
  // repeated uint32 boss_buff = 5;
  repeated AmuletTileScore tile_score_map = 6;
  uint32 book_effect_id = 8;
  repeated AmuletFanValue fan_value_map = 9;
  uint32 init_change_hand_count = 10; // 初始换手牌数量
}

message ActivityAmuletIllustratedBookData {
  repeated uint32 effect_collection = 1; // 已收集的护身符
  repeated uint32 badge_collection = 4; // 已收集的印章
  repeated uint32 rune_stone_collection = 5; // 已收集的符文石
  // ActivityAmuletHuRecord highest_hu = 2; // 历史最高胡牌记录
  // uint32 highest_level = 3; // 历史最高关卡记录
}

message ActivityAmuletEffectRecordData {
  uint32 id = 1;
  uint32 badge_id = 2;
  uint32 volume = 3;
}

message ActivityAmuletGameRecordData {
  repeated ActivityAmuletEffectRecordData effect_builds = 1;
  uint32 level = 2; // 大关，amulet_level 表的 level 字段
  string highest_level_score = 3;
  string highest_fan = 4;
  string highest_score = 5;
  string coin_consumed = 6;
  uint32 pack_count = 7;
  uint32 time = 8;
  ActivityAmuletHuRecord highest_hu = 9; // 最高和牌记录
  uint32 level_node = 10; // 关卡节点，amulet_node 表的 node 字段
}

message ActivityAmuletStatisticData {
  uint32 highest_level = 1; // 历史最高关卡记录 大关，amulet_level 表的 level 字段
  ActivityAmuletHuRecord highest_hu = 2; // 历史最高和牌记录
  string highest_level_score = 3;
  string highest_fan = 4;
  string highest_score = 5;
  uint32 pass_game_count = 6; // 	完成5-3的次数
  uint32 round_count = 7; // 完成小关数量
  uint32 open_pack_count = 8; // 累计开包次数，包含商店+过关奖励
  string highest_coin_consumed = 9; // 最多单轮花费星币
  repeated CharacterStatistic character_statistic = 10; // 角色统计数据
  uint32 highest_level_node = 11 ; // 历史最高关卡记录 节点，amulet_node 表的 node 字段
}

message CharacterStatistic {
  uint32 character_id = 1; // 角色 id
  uint32 highest_level = 2; // 历史最高关卡记录 大关，amulet_level 表的 level 字段
  string highest_score = 3; // 最大的分数
  uint32 highest_level_node = 4; // 历史最高关卡节点 节点，amulet_node 表的 node 字段
}

// 修改同时也需要修改 BlobAmuletActivity
message ActivityAmuletData {
  uint32 activity_id = 1;
  AmuletGameData game = 2; // 游戏对局信息
  uint32 version = 3;
  ActivityAmuletUpgradeData upgrade = 4; // 永久强化信息
  ActivityAmuletIllustratedBookData illustrated_book = 5; // 图鉴信息
  uint32 book_effect_id = 6; // 钦定护身符，可能为空
  repeated ActivityAmuletGameRecordData game_records = 7; // 最近通关记录
  ActivityAmuletStatisticData statistic = 8; // 统计数据
}

message AmuletFan {
  uint32 id = 1;
  string val = 2;
  uint32 count = 3;
  bool yiman = 4;
}

message AmuletHookResult {
  message AddEffectResult {
    uint32 uid = 1; // 新护身符uid
    uint32 id = 2; // 新护身符id

    // 如果发生升级/合并会有以下值
    uint32 merge_type = 3; // 1 - 相同护身符合并   2 - 护身符组合并  3 - 替换印章
    repeated uint32 merged_list = 4; // 合并护身符uid
    uint32 merged_result = 5; // 合并结果（uid）
    AmuletBadgeData badge = 6; // 印章
    repeated string store = 7;
    uint32 volume = 8; // 生成的护身符(uid)体积
  }
  repeated AddEffectResult add_effect = 1;
  repeated uint32 remove_effect = 2; // 移除护身符 uid

  repeated uint32 add_buff = 3;
  repeated uint32 remove_buff = 4;

  repeated string add_tian_dora = 5;

  message AddDoraResult {
    uint32 count = 1; // 新增 dora 数量
    repeated uint32 list = 2; // 实际增加的 dora，牌id
  }
  AddDoraResult add_dora = 6;

  message BigIntValueResult {
    string origin = 1;
    string modify = 2;
    string final = 3;
  }
  BigIntValueResult coin_modify = 8; // 金币修改

  repeated AmuletTile tile_replace = 10; // 牌替换的列表

  repeated uint32 add_show_tile = 11; // 增加的公开牌id列表

  repeated AmuletTileScore modify_tile_score = 12; // 牌基础分变化

  int32 calc_desktop_count = 13; // 待摸牌初始数量
  int32 modify_desktop_count = 14; // 待摸牌变化
  int32 modify_show_desktop_count = 15; // 公开待摸牌数量变化
  int32 modify_lock_tile_count = 16; // 锁定牌数量变化
  int32 modify_change_hands_count = 17; // 开局的时候修改换牌次数
  int32 modify_change_hands_tile_count = 18; // 修改单次换牌牌数, 一次换牌能换几张牌

  bool force_moqie = 19; // 强制模切
  bool replace_hu = 20; // 变牌后可以和牌
  string modify_target_point = 21; // 目标分数变化
  bool upgrade_level = 22; // 无视过关分数直接过关

  message ModifyDoraResult {
    string tile = 1;
    bool is_dora = 2;
    bool is_red_dora = 3;
    bool is_tian_dora = 4;
    uint32 dora_count = 5; // 一张牌算作几dora（可能存在两张相同的宝牌指示牌的情况）
  }
  repeated ModifyDoraResult modify_dora = 23; // 修改宝牌判定
  // bool modify_tian_dora = 24;
  int32 modify_dora_max_count = 25; // 修改最大宝牌数量
  int32 modify_shop_goods_count = 26; // 修改商店刷新卡包数量
  bool modify_shop_rare_weight = 27; // 修改商店卡包稀有度
  bool modify_shop_goods_price = 28; // 修改商店卡包价格
  repeated uint32 modify_shop_pack_effect = 29; // 修改购买卡包后待选护身符列表
  int32 modify_effect_max_count = 30; // 修改持有护身符上限

  repeated AmuletGameShopGoods modify_goods = 31; // 修改商店卡包列表
  repeated uint32 remove_goods = 32; // 移除商店卡包

  BigIntValueResult modify_base = 33; // 基础分修改
  BigIntValueResult modify_fan = 34; // 番数修改
  repeated AmuletFan modify_fan_info = 37; // 番信息变化

  message TransformResult {
    uint32 uid = 1;
    uint32 effect_id = 2;
    AddEffectResult add_result = 3;
  }

  repeated TransformResult transform_effect = 39; // 护身符变形(从A卡变为B卡)

  message AddBadge {
    uint32 uid = 1; // 护身符uid
    uint32 badge_id = 2; // 印章id
    uint32 badge_uid = 3; // 印章uid
  }
  repeated AddBadge add_badge = 40; // 添加印章

  repeated uint32 remove_badge = 41; // 移除印章(护身符uid)

  string modify_effect_price = 42; // 修改护身符出售价

  message CopyEffect {
    uint32 uid = 1; // 拷贝生成的护身符uid
    uint32 from_uid = 2; // 从哪个护身符拷贝来的
  }
  repeated CopyEffect copy_effect = 43; // 拷贝护身符

  bool effect_growth = 44; // 护身符数值成长

  string modify_tile_score_aura = 45; // 修改牌基础分成长值，光环效果，不需要抖动动画

  uint32 modify_hule_count = 46; // 修改和牌次数
  bool can_gang = 47; // 是否可以开杠
  repeated uint32 modify_change_hands_list = 48; // 修改换牌(修改换牌后的全量手牌数据)

  message AmuletChangeDesktopResult {
    repeated AmuletShowDesktopTileData show_desktop_tiles = 1; // 当前可见牌
    repeated uint32 desktop = 2; // 待摸牌id列表
    uint32 locked_tile_count = 3; // 锁定牌数量
    uint32 desktop_remain = 4; // 待摸牌数量
    repeated uint32 locked_tile = 5; // 锁定牌id列表
    // repeated uint32 berserk_tile = 6; // 狂暴牌id列表
    repeated uint32 berserk_tile_pos = 7; // 狂暴牌位置列表
  }
  AmuletChangeDesktopResult modify_change_desktop = 49; // 修改待摸牌数据

  uint32 self_effect_id = 50; // 自身效果变化效果（如星际黑客凌与不稳定的护身符）

  string modify_change_coin = 51; // 修改获取星币数量

  repeated AmuletTileScore set_tile_score = 52; // 直接设置牌基础分

  message UpgradeEffectResult {
    uint32 uid = 1; // 护身符uid
    uint32 id = 2; // 新护身符id

    AmuletBadgeData badge = 3; // 印章
    repeated string store = 4;
    uint32 volume = 5; // 新护身符体积
  }
  repeated UpgradeEffectResult upgrade_effect = 53; // 护身符升级

  repeated AmuletTileScore modify_tile_base_score = 54; // 修改和牌基础分

  message UInt32ValueResult {
    uint32 origin = 1;
    uint32 modify = 2;
    uint32 final = 3;
  }
  UInt32ValueResult heal = 55; // 对目标造成治疗
  UInt32ValueResult damage = 56; // 对目标造成伤害

  uint32 modify_berserk_tile_count = 57; // 狂暴牌数量变化
  BigIntValueResult modify_enemy_max_hp = 58; // 敌人最大生命值变化

  repeated AmuletFanValue add_fan_value = 59; // 番数值增加
